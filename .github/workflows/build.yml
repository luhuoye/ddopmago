name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -y && sudo apt-get install -y p7zip-full zip
      - name: Prepare dictionary volumes (only if missing)
        run: bash tools/prepare_dict.sh
      - name: Commit dictionary volumes
        run: |
          if [ -n "$(git status --porcelain app/src/main/assets/dict)" ]; then
            git config user.name github-actions
            git config user.email actions@github.com
            git add app/src/main/assets/dict
            git commit -m "Add dictionary volumes [skip ci]"
            git push || echo "push skipped"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ddopmago-apk
          path: app/build/outputs/apk/debug/*.apk
